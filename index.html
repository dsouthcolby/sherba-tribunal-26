<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sherba Tribunal</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@144,900,100,1&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one narrow phone-first column; sticky header with tabs; topic "dockets" stacked as cards */
:root{
  /* McGill red #ED1B2F (McGill visual identity guide) with warm greys */
  /* Neutral greys #F4F4F4 / #D4D4D4 and black per the guide's web palette */
  --brand:#ED1B2F; --on-brand:#FFFFFF;
  --bg:#F4F4F4; --surface:#FFFFFF; --ink:#000000; --muted:#555555; --line:#D4D4D4;
  --accent:#ED1B2F; --accent-soft:#FDE6E8; --good:#1D7A5F; --good-soft:#DDF1EA; --bad:#B0101F;
  --display:"EB Garamond", Garamond, "Times New Roman", Times, serif;
  --body:"Source Sans 3", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1E1E1E; --ink:#F4F4F4; --muted:#AAAAAA; --line:#383838;
  --accent:#FF4A5B; --accent-soft:#3E1A1F; --good:#4CC59C; --good-soft:#163A30; --bad:#FF8A93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1E1E1E; --ink:#F4F4F4; --muted:#AAAAAA; --line:#383838;
  --accent:#FF4A5B; --accent-soft:#3E1A1F; --good:#4CC59C; --good-soft:#163A30; --bad:#FF8A93; color-scheme:dark}
.foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:28px}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand);padding-block:18px 0;box-shadow:0 0 0 100vmax var(--brand);clip-path:inset(0 -100vmax)}
.eyebrow{font-family:var(--body);font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin:0 0 2px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:1.9rem;letter-spacing:0;margin:0;line-height:1.05}
h1 span{font-style:italic;font-weight:500}
.crew{display:flex;align-items:center}
.crew .av{margin-left:-6px;border:2px solid var(--brand)}
.crew .more{font-size:.75rem;color:var(--on-brand);opacity:.9;margin-left:6px;font-variant-numeric:tabular-nums}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;flex:none}
/* Tabs in two groups: Tribunal (Open, Verdicts, + Topic) on the left; Trip (Plan, Links) on the right on a dark tab */
nav{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav .grp{display:flex;gap:2px;flex:none}
nav .grp.trip{background:#231F20;border-radius:10px 10px 0 0;padding:0 4px}
nav .grp.trip button[aria-selected="true"]{border-bottom-color:#F5B841}
nav button{flex:0 0 auto;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px;font:600 .9rem var(--body);color:var(--on-brand);opacity:.72;cursor:pointer}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:var(--on-brand)}
nav .n{font-variant-numeric:tabular-nums;font-weight:500;opacity:.8}
main{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.chip.open{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip.closed{background:var(--good-soft);border-color:transparent;color:var(--good)}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.2;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sub{font-size:.85rem;color:var(--muted);margin:0}
.progress{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 .95rem var(--body);cursor:pointer;text-align:left;min-width:0}
.opt span{overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opt:disabled{cursor:default;opacity:.55}
.ranked{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ranked li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.ranked .pos{font-family:var(--display);font-weight:800;width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.ranked .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:6px}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 16px;font:700 .92rem var(--body);cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
nav button:focus-visible{outline:3px solid var(--on-brand);outline-offset:-3px}
.btn:focus-visible,.opt:focus-visible,.x:focus-visible,input:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.results li{display:grid;grid-template-columns:2em 1fr auto;gap:10px;align-items:center}
.results .pos{font-family:var(--display);font-weight:800;font-size:1.1rem;text-align:right;font-variant-numeric:tabular-nums}
.results .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
.results .score{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.results .track{grid-column:2 / 4;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:-4px}
.results .track i{display:block;height:100%;background:var(--muted);border-radius:3px}
.results li.win .track i{background:var(--accent)}
.results li.win .nm::after{content:" ★";color:var(--accent)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.ballots{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.ballots b{font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password]{font:500 1rem var(--body);padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .88rem var(--body);cursor:pointer;text-align:left}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog{display:flex;align-items:flex-start;gap:10px;font-size:.92rem;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.tog small{display:block;color:var(--muted);font-size:.78rem}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.note{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;max-width:calc(100% - 32px);z-index:20}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem;font-weight:600}
@media (prefers-reduced-motion:no-preference){.bar i,.track i{transition:width .4s ease}}
header:has(nav[hidden]){padding-bottom:16px}
.signout{background:none;border:1.5px solid rgba(255,255,255,.55);color:var(--on-brand);font:600 .78rem var(--body);padding:5px 10px;border-radius:8px;cursor:pointer}
.signout:focus-visible{outline:3px solid var(--on-brand);outline-offset:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
/* Plan tab: styled after the printed "Bienvenue à Montréal" itinerary. Fixed paper colours in both themes. */
.poster{--paper:#FFFFFF;--cream:#F6ECD9;--blue:#5B8ED6;--navy:#2E3A59;--dash:#D9483B;--hi:#E3EAF7;
  background:var(--paper);border-radius:6px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.08)}
.poster .in{background:var(--cream);padding:6px 18px 22px;color:var(--navy);font-family:Montserrat,var(--body);text-align:center}
.poster svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.poster .pt,.poster .day{font-family:Fraunces,var(--display);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--blue);letter-spacing:-.01em;margin:0}
.poster .pt{font-size:clamp(1.6rem,8.4vw,2.2rem);line-height:1.05;margin-top:2px}
.poster .ps{font-style:italic;font-size:.95rem;margin:4px 0 0}
.poster .rule{border:0;border-top:2.5px dashed var(--dash);width:46%;margin:16px auto 14px}
.poster .day{font-size:1.75rem;line-height:1.1;margin:20px 0 6px}
.poster .nn{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;background:var(--paper);border-radius:8px;padding:10px 12px}
.poster .nn div{min-width:0}
.poster .nn .lab{font-size:.64rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dash);margin:0}
.poster .nn .big{font-weight:600;font-size:.98rem;line-height:1.25;margin:2px 0 0;overflow-wrap:anywhere}
.poster .nn .sm{font-size:.76rem;opacity:.75;margin:2px 0 0;font-variant-numeric:tabular-nums}
.poster .nn.solo{grid-template-columns:1fr;text-align:center}
.poster ol{list-style:none;margin:0;padding:0}
.poster li{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline;padding:7px 8px;border-radius:6px;font-size:.88rem}
.poster li .tm{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.poster li .what{text-align:right;overflow-wrap:anywhere}
.poster li .det{grid-column:1 / -1;text-align:right;font-size:.74rem;opacity:.8;line-height:1.4}
.poster li.done{opacity:.42}
.poster li.now{background:var(--hi);font-weight:600}
.poster .tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:2px;background:var(--blue);color:#fff}
.poster .tag.nx{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.poster .foot2{font-size:.72rem;opacity:.7;margin:18px 0 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .poster{--paper:#EDE7DC;--cream:#E6D9C1;--hi:#D3DCEC}}
:root[data-theme="dark"] .poster{--paper:#EDE7DC;--cream:#E6D9C1;--hi:#D3DCEC}
@media (max-width:374px){.poster{padding:8px}.poster .in{padding:4px 10px 18px}.poster .nn{padding:9px 10px;gap:10px}.poster .nn .lab{letter-spacing:.08em}}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.links li{display:flex;gap:10px;align-items:flex-start;padding-top:10px;border-top:1px solid var(--line)}
.links li:first-child{border-top:0;padding-top:0}
.links .body{flex:1;min-width:0}
.links a{color:var(--accent);font-weight:700;overflow-wrap:anywhere;text-underline-offset:2px}
.links .host,.links .by{font-size:.78rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.links .nt{font-size:.88rem;margin:2px 0 0;overflow-wrap:anywhere}


div.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;color:var(--muted)}
@media (max-width:374px){nav{gap:2px} nav button{padding:10px 5px;font-size:.84rem} nav .grp.trip{padding:0 3px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div><p class="eyebrow">Est. at McGill · Montréal</p><h1>Sherba <span>Tribunal</span></h1></div>
      <div class="right"><div class="crew" id="crew" aria-label="Who has joined"></div><button class="signout" id="signout" hidden>Sign out</button></div>
    </div>
    <nav role="tablist" hidden>
      <div class="grp" role="presentation">
        <button role="tab" id="tab-open" aria-selected="true" data-tab="open">Open <span class="n" id="n-open"></span></button>
        <button role="tab" id="tab-closed" aria-selected="false" data-tab="closed">Verdicts <span class="n" id="n-closed"></span></button>
        <button role="tab" id="tab-new" aria-selected="false" data-tab="new">+ Topic</button>
      </div>
      <div class="grp trip" role="presentation">
        <button role="tab" id="tab-plan" aria-selected="false" data-tab="plan">Plan</button>
        <button role="tab" id="tab-links" aria-selected="false" data-tab="links">Links <span class="n" id="n-links"></span></button>
      </div>
    </nav>
  </header>
  <main id="main"><div class="empty"><h2>Loading the docket</h2></div></main>
  <p class="foot">Sherba Tribunal · McGill crew, on tour · Not affiliated with McGill University</p>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
